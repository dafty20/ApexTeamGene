<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>チーム画像ジェネレーター</title>

<style>
@font-face{
  font-family:"night";
  src:url("./59ae5f46-fb5b-4ae0-8b1c-32918d3b35dd.otf") format("opentype");
}

body{background:#0f172a;color:#fff;text-align:center;}
input,select,button{margin:5px;padding:8px;}
canvas{width:960px;margin-top:20px;border-radius:16px;}
</style>
</head>
<body>

<h2>チーム画像ジェネレーター</h2>

<p>リーダー</p>
<input type="file" id="leaderIcon">
<input type="text" id="leaderName">
<select id="leaderRank"></select>

<p>メンバー1</p>
<input type="file" id="member1Icon">
<input type="text" id="member1Name">
<select id="member1Rank"></select>

<p>メンバー2</p>
<input type="file" id="member2Icon">
<input type="text" id="member2Name">
<select id="member2Rank"></select>

<br>
<input type="text" id="teamName" placeholder="チーム名"><br>

<button onclick="generate()">生成</button>
<button onclick="download()">保存</button>

<canvas id="canvas" width="1920" height="1080"></canvas>

<script>

// フォント読み込み
async function loadFont(){
  const font = new FontFace("night", "url(./59ae5f46-fb5b-4ae0-8b1c-32918d3b35dd.otf)");
  await font.load();
  document.fonts.add(font);
  await document.fonts.ready;
}

const ranks=["predetor","master","diamond","platinum","gold","silver","bronze","rookie"];

["leaderRank","member1Rank","member2Rank"].forEach(id=>{
  const sel=document.getElementById(id);
  ranks.forEach((r,i)=>{
    const o=document.createElement("option");
    o.value=r;
    o.textContent=`${i+1}.${r}`;
    sel.appendChild(o);
  });
});

const rankImgs={};
ranks.forEach((r,i)=>rankImgs[r]=`${i+1}.${r}.png`);

function load(file){
  return new Promise(res=>{
    const img=new Image();
    img.src=URL.createObjectURL(file);
    img.onload=()=>res(img);
  });
}

// 背景
function drawBG(ctx){
  const g=ctx.createLinearGradient(0,0,1920,1080);
  g.addColorStop(0,"#ffffff");
  g.addColorStop(1,"#d1d5db");
  ctx.fillStyle=g;
  ctx.fillRect(0,0,1920,1080);

  for(let i=0;i<3000;i++){
    ctx.fillStyle="rgba(0,0,0,0.03)";
    ctx.fillRect(Math.random()*1920,Math.random()*1080,2,2);
  }
}

// チーム名
function drawTeam(ctx,name){
  const grad=ctx.createLinearGradient(700,0,1200,0);
  grad.addColorStop(0,"#7c3aed");
  grad.addColorStop(1,"#ec4899");

  ctx.font="110px night";
  ctx.textAlign="center";

  ctx.shadowColor="rgba(124,58,237,0.5)";
  ctx.shadowBlur=30;

  ctx.fillStyle=grad;
  ctx.fillText(name,960,170);

  ctx.shadowBlur=0;
}

// アイコン
function drawCard(ctx,img,x,y,size){
  ctx.lineWidth=6;
  ctx.strokeStyle="#9ca3af";
  ctx.beginPath();
  ctx.roundRect(x-5,y-5,size+10,size+10,30);
  ctx.stroke();

  ctx.fillStyle="#fff";
  ctx.beginPath();
  ctx.roundRect(x,y,size,size,26);
  ctx.fill();

  ctx.shadowColor="rgba(0,0,0,0.2)";
  ctx.shadowBlur=25;

  const m=Math.min(img.width,img.height);
  const sx=(img.width-m)/2;
  const sy=(img.height-m)/2;

  ctx.save();
  ctx.beginPath();
  ctx.roundRect(x,y,size,size,26);
  ctx.clip();
  ctx.drawImage(img,sx,sy,m,m,x,y,size,size);
  ctx.restore();

  ctx.shadowBlur=0;
}

// ランク
async function drawRank(ctx,rank,x,y,size){
  const img=new Image();
  img.src=rankImgs[rank];

  await new Promise(r=>{
    img.onload=()=>{
      ctx.shadowColor="rgba(0,0,0,0.4)";
      ctx.shadowBlur=15;
      ctx.drawImage(img,x+10,y+size-160,160,160);
      ctx.shadowBlur=0;
      r();
    };
    img.onerror=r;
  });
}

// 名前
function drawName(ctx,name,x,y,isLeader=false){
  ctx.font = isLeader ? "64px night" : "52px night";
  ctx.textAlign="center";
  ctx.fillStyle="#111";
  ctx.fillText(name,x,y);
}

// ★強化ラベル
function drawLabel(ctx,text,x,y,isLeader=false){
  const labelWidth = 220;
  const labelHeight = 70;

  // 背景
  ctx.fillStyle = isLeader ? "rgba(124,58,237,0.85)" : "rgba(0,0,0,0.65)";
  ctx.beginPath();
  ctx.roundRect(x+20,y+20,labelWidth,labelHeight,18);
  ctx.fill();

  // 枠
  ctx.lineWidth=3;
  ctx.strokeStyle="#fff";
  ctx.stroke();

  // 文字
  ctx.font="40px night";
  ctx.textAlign="center";
  ctx.textBaseline="middle";

  const textX = x+20+labelWidth/2;
  const textY = y+20+labelHeight/2;

  // 縁取り
  ctx.lineWidth=6;
  ctx.strokeStyle="#000";
  ctx.strokeText(text,textX,textY);

  ctx.fillStyle="#fff";
  ctx.fillText(text,textX,textY);
}

async function generate(){
  await loadFont();

  const ctx=document.getElementById("canvas").getContext("2d");

  drawBG(ctx);
  drawTeam(ctx,teamName.value);

  const leader=await load(leaderIcon.files[0]);
  const m1=await load(member1Icon.files[0]);
  const m2=await load(member2Icon.files[0]);

  const size=450;
  const gap=100;
  const startX=(1920-(size*3+gap*2))/2;
  const y=250;

  const pos=[
    startX,
    startX+size+gap,
    startX+(size+gap)*2
  ];

  const imgs=[leader,m1,m2];
  const names=[leaderName.value,member1Name.value,member2Name.value];
  const ranksVal=[leaderRank.value,member1Rank.value,member2Rank.value];

  const labels=["LEADER","MEMBER","MEMBER"];

  for(let i=0;i<3;i++){
    drawCard(ctx,imgs[i],pos[i],y,size);
    drawLabel(ctx,labels[i],pos[i],y,i===0);
    await drawRank(ctx,ranksVal[i],pos[i],y,size);
    drawName(ctx,names[i],pos[i]+size/2,y+size+90,i===0);
  }
}

function download(){
  const c=document.getElementById("canvas");
  const a=document.createElement("a");
  a.href=c.toDataURL();
  a.download="team.png";
  a.click();
}
</script>

</body>
</html>
